name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: gate
    runs-on: ubuntu-22.04
    # The compiler is built from source several times (once per suite, then gen2
    # and gen3 for the self-hosting gate), and every `(test …)` case lowers and
    # links its whole module, so the six gates take about an hour. The budget is
    # set to twice that so a slow runner fails for a real reason.
    timeout-minutes: 90
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          # The formatting gate diffs against main, which needs the merge base.
          fetch-depth: 0
      # clang and lld link the compiler and the programs it builds; gcc and jq
      # are the differential oracles in tools/accept.sh. Python is present only
      # because the surviving contract tests are written in it — no gate runs a
      # compiler written in Python.
      #
      # gcc-aarch64-linux-gnu and libc6-dev-arm64-cross are the sysroot clang
      # cross-links `--target aarch64-unknown-linux-gnu` against, and
      # qemu-user-static runs the result. accept.sh's target section fails by
      # name without them; the arm64 cases in tests/test_cli.py skip rather
      # than fail, so a contributor's machine needs them only to check arm64.
      #
      # clang is pinned rather than taken from PATH. The image ships several
      # LLVM releases, `bootstrap/logosc` carries the clang that built it in
      # `.comment`, and the self-hosting gate requires the compiler built from
      # this source to equal that binary byte for byte — a claim only clang 14
      # can make, because codegen changes between releases. `tools/toolchain.sh`
      # holds the pin and the record, so this file and a contributor's machine
      # cannot disagree about it.
      - name: install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-14 lld-14 gcc jq python3 gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static
          bash tools/toolchain.sh --install
      - name: toolchain provenance
        run: |
          bash tools/toolchain.sh --check
      - name: prepare main for the changed-file format gate
        run: |
          git rev-parse --verify --quiet main > /dev/null || git branch main origin/main
      # Precondition, not a gate: it runs before any gate and stops the job when
      # a commit is unsigned. Only for a pull request -- a push to main has no
      # base to compare against and must not re-litigate commits already merged.
      # The base and head SHAs come from the event, so the range is exactly this
      # PR. The documented gate list in AGENTS.md stays at six commands.
      - name: sign-off
        if: github.event_name == 'pull_request'
        env:
          DCO_BASE: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bash tools/check_dco.sh
      - name: unit tests
        run: |
          make test
      - name: corpus
        run: |
          ./tools/logosc.sh test tests
      - name: acceptance
        run: |
          bash tools/accept.sh
      - name: manual drift
        run: |
          ./tools/logosc.sh guide --check
      - name: formatting
        shell: bash
        run: |
          if [[ -n "$(git diff --name-only main...HEAD -- '*.logos')" ]]; then
            ./tools/logosc.sh fmt $(git diff --name-only main...HEAD -- '*.logos')
          fi
          ./tools/logosc.sh fmt tests docs/manual
          git diff --exit-code -- '*.logos'
      - name: self-hosting
        run: |
          bash tools/selfhost.sh
